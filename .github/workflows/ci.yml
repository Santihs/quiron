name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project dependencies
        # all workspace packages, but NOT the tts/stt extras: CI has no GPU or
        # audio device, and the voice tests run against fake engines.
        run: uv sync --locked --dev --all-packages

      - name: Run tests
        run: uv run pytest -q

      - name: Run voice package tests
        run: uv run --package quiron-voice pytest packages/quiron-voice -q

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run Pyright
        run: pnpm dlx pyright
